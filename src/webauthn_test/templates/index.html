{% extends "base.html" %}
{% block body %}
  <h1>WebAuthn Demo</h1>
  {% if username %}
    <p>hello, {{ username }}</p>
  {% else %}
    <p>Please <a href="{{ url_for('security.login') }}">log in</a> or <a href="{{ url_for('security.register') }}">register</a>.</p>
    <h2>Passkey Login</h2>
    <p>
      <label>Username<br>
      <input id="passkey-username" type="text" placeholder="your username"></label>
    </p>
    <p>
      <button id="passkey-login" type="button">Sign in with Passkey</button>
    </p>
    <p id="passkey-status"></p>
    <script>
      const statusNode = document.getElementById("passkey-status");
      function b64urlToBytes(value) {
        const padding = "=".repeat((4 - value.length % 4) % 4);
        const base64 = (value + padding).replace(/-/g, "+").replace(/_/g, "/");
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }
      function bytesToB64url(bytes) {
        let binary = "";
        bytes.forEach((b) => { binary += String.fromCharCode(b); });
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
      function decodeRequestOptions(options) {
        options.challenge = b64urlToBytes(options.challenge);
        if (Array.isArray(options.allowCredentials)) {
          options.allowCredentials = options.allowCredentials.map((item) => ({
            ...item,
            id: b64urlToBytes(item.id),
          }));
        }
        return options;
      }
      function encodeAssertion(credential) {
        return {
          id: credential.id,
          rawId: bytesToB64url(new Uint8Array(credential.rawId)),
          type: credential.type,
          response: {
            authenticatorData: bytesToB64url(new Uint8Array(credential.response.authenticatorData)),
            clientDataJSON: bytesToB64url(new Uint8Array(credential.response.clientDataJSON)),
            signature: bytesToB64url(new Uint8Array(credential.response.signature)),
            userHandle: credential.response.userHandle
              ? bytesToB64url(new Uint8Array(credential.response.userHandle))
              : null,
          },
        };
      }
      document.getElementById("passkey-login").addEventListener("click", async () => {
        const username = document.getElementById("passkey-username").value.trim();
        if (!username) {
          statusNode.textContent = "Username is required.";
          return;
        }
        try {
          statusNode.textContent = "Preparing passkey request...";
          const beginResp = await fetch("/webauthn/login/begin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username }),
          });
          const beginData = await beginResp.json();
          if (!beginResp.ok) throw new Error(beginData.error || "Passkey login begin failed");
          const publicKey = decodeRequestOptions(beginData);
          const credential = await navigator.credentials.get({ publicKey });
          if (!credential) throw new Error("No credential selected.");
          const finishResp = await fetch("/webauthn/login/finish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(encodeAssertion(credential)),
          });
          const finishData = await finishResp.json();
          if (!finishResp.ok) throw new Error(finishData.error || "Passkey login failed");
          window.location = finishData.redirect || "/";
        } catch (error) {
          statusNode.textContent = String(error);
        }
      });
    </script>
  {% endif %}
{% endblock %}
