# Apache macro example for this app (mod_wsgi daemon mode, no backend port).
# Requires mod_macro + mod_wsgi + mod_md (or your existing TLS automation).

#   PyApp $host                      $title     $appdir                 $unixuser  $unixgroup
Use PyApp webauthn.home.koehntopp.de webauthn   /home/webauthn/webauth webauthn   webauthn

<Macro PyApp $host $title $appdir $unixuser $unixgroup>
    <VirtualHost *:80>
        ServerName $host
        RewriteEngine On
        RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    </VirtualHost>

    <VirtualHost *:443>
        ServerName $host

        # TLS is managed by mod_md / existing Apache TLS automation.
        SSLEngine On

        DocumentRoot $appdir

        # IMPORTANT: use the virtualenv path that exists on your host.
        WSGIDaemonProcess $title \
            processes=5 \
            threads=2 \
            user=$unixuser \
            group=$unixgroup \
            display-name=%{GROUP} \
            maximum-requests=100 \
            python-home=$appdir/venv \
            python-path=$appdir/src

        WSGIProcessGroup $title
        WSGIPassAuthorization On
        WSGIScriptAlias / $appdir/app.wsgi

        <Directory $appdir>
            Options Indexes FollowSymLinks
            AllowOverride None
            Require all granted
        </Directory>

        ErrorLog  /var/log/httpd/error-$host.log
        CustomLog /var/log/httpd/access-$host.log combined
    </VirtualHost>
</Macro>
