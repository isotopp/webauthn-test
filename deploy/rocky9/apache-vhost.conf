# /etc/httpd/conf.d/webauthn.conf
<VirtualHost *:443>
    ServerName webauthn.home.koehntopp.de

    # TLS material is managed externally (Let's Encrypt / certbot workflow).
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/webauthn.home.koehntopp.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/webauthn.home.koehntopp.de/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog  /var/log/httpd/webauthn-error.log
    CustomLog /var/log/httpd/webauthn-access.log combined
</VirtualHost>
