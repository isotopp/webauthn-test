[uwsgi]
chdir = /opt/webauthn-test/current
module = webauthn_test.wsgi:app

# Run HTTP on localhost only; Apache is the public TLS endpoint.
http-socket = 127.0.0.1:8080

master = true
processes = 4
threads = 2

need-app = true
single-interpreter = true
vacuum = true
die-on-term = true

# Keep runtime artifacts under application ownership.
pidfile = /var/run/webauthn/uwsgi.pid

# uWSGI-level safety limits.
harakiri = 60
max-requests = 5000
